syntax = "proto3";

package product;
option go_package="./product";

// ---- 分类管理 ----
message CreateCategoryRequest {
  string name = 1;
  int64 parent_id = 2;
  int32 sort_order = 3;
}

message CreateCategoryResponse {
  uint32 category_id = 1;
  bool success = 2;
  string msg = 3;
}

message UpdateCategoryRequest {
  uint32 category_id = 1;
  string name = 2;
  int64 parent_id = 3;
  int32 sort_order = 4;
  int32 status = 5;
}

message UpdateCategoryResponse {
  bool success = 1;
  string msg = 2;
}

message DeleteCategoryRequest {
  uint32 category_id = 1;
}

message DeleteCategoryResponse {
  bool success = 1;
  string msg = 2;
}

message ListCategoryRequest {
}

message CategoryInfo {
  uint32 category_id = 1;
  string name = 2;
  int64 parent_id = 3;
  int32 sort_order = 4;
  int32 status = 5;
  string created_at = 6;
  string updated_at = 7;
  repeated CategoryInfo children = 8;
}

message ListCategoryResponse {
  repeated CategoryInfo categories = 1;
  bool success = 2;
  string msg = 3;
}

// ---- 商品管理 ----
message CreateProductRequest {
  string name = 1;
  string description = 2;
  int64 category_id = 3;
  string main_image = 4;
  string images = 5;       // json数组
  double price = 6;
  int32 stock = 7;
}

message CreateProductResponse {
  uint32 product_id = 1;
  bool success = 2;
  string msg = 3;
}

message UpdateProductRequest {
  uint32 product_id = 1;
  string name = 2;
  string description = 3;
  int64 category_id = 4;
  string main_image = 5;
  string images = 6;
  double price = 7;
  int32 stock = 8;
}

message UpdateProductResponse {
  bool success = 1;
  string msg = 2;
}

message DeleteProductRequest {
  uint32 product_id = 1;
}

message DeleteProductResponse {
  bool success = 1;
  string msg = 2;
}

message GetProductRequest {
  uint32 product_id = 1;
}

message GetProductResponse {
  uint32 product_id = 1;
  string name = 2;
  string description = 3;
  int64 category_id = 4;
  string main_image = 5;
  string images = 6;
  double price = 7;
  int32 stock = 8;
  int32 status = 9;
  int32 sales_count = 10;
  string created_at = 11;
  string updated_at = 12;
  bool success = 13;
  string msg = 14;
}

message ListProductRequest {
  int32 page = 1;
  int32 page_size = 2;
  int64 category_id = 3;
  int32 status = 4;        // -1:全部 0:下架 1:上架
  string keyword = 5;
}

message ProductInfo {
  uint32 product_id = 1;
  string name = 2;
  string description = 3;
  int64 category_id = 4;
  string main_image = 5;
  double price = 7;
  int32 stock = 8;
  int32 status = 9;
  int32 sales_count = 10;
  string created_at = 11;
  string updated_at = 12;
}

message ListProductResponse {
  repeated ProductInfo products = 1;
  int64 total = 2;
  bool success = 3;
  string msg = 4;
}

message UpdateProductStatusRequest {
  uint32 product_id = 1;
  int32 status = 2;        // 0下架 1上架
}

message UpdateProductStatusResponse {
  bool success = 1;
  string msg = 2;
}

// ---- SKU管理 ----
message CreateSkuRequest {
  uint32 product_id = 1;
  string sku_code = 2;
  string specs = 3;        // json: {"颜色":"红","尺寸":"L"}
  double price = 4;
  int32 stock = 5;
}

message CreateSkuResponse {
  uint32 sku_id = 1;
  bool success = 2;
  string msg = 3;
}

message UpdateSkuRequest {
  uint32 sku_id = 1;
  string sku_code = 2;
  string specs = 3;
  double price = 4;
  int32 stock = 5;
  int32 status = 6;
}

message UpdateSkuResponse {
  bool success = 1;
  string msg = 2;
}

message DeleteSkuRequest {
  uint32 sku_id = 1;
}

message DeleteSkuResponse {
  bool success = 1;
  string msg = 2;
}

message ListSkuRequest {
  uint32 product_id = 1;
}

message SkuInfo {
  uint32 sku_id = 1;
  uint32 product_id = 2;
  string sku_code = 3;
  string specs = 4;
  double price = 5;
  int32 stock = 6;
  int32 status = 7;
  string created_at = 8;
}

message ListSkuResponse {
  repeated SkuInfo skus = 1;
  bool success = 2;
  string msg = 3;
}

service Product {
  rpc CreateCategory(CreateCategoryRequest) returns(CreateCategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns(UpdateCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns(DeleteCategoryResponse);
  rpc ListCategory(ListCategoryRequest) returns(ListCategoryResponse);

  rpc CreateProduct(CreateProductRequest) returns(CreateProductResponse);
  rpc UpdateProduct(UpdateProductRequest) returns(UpdateProductResponse);
  rpc DeleteProduct(DeleteProductRequest) returns(DeleteProductResponse);
  rpc GetProduct(GetProductRequest) returns(GetProductResponse);
  rpc ListProduct(ListProductRequest) returns(ListProductResponse);
  rpc UpdateProductStatus(UpdateProductStatusRequest) returns(UpdateProductStatusResponse);

  rpc CreateSku(CreateSkuRequest) returns(CreateSkuResponse);
  rpc UpdateSku(UpdateSkuRequest) returns(UpdateSkuResponse);
  rpc DeleteSku(DeleteSkuRequest) returns(DeleteSkuResponse);
  rpc ListSku(ListSkuRequest) returns(ListSkuResponse);
}
